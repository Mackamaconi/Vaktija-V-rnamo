<style>
:root{
  --green:#0d5946;
  --green-dark:#084636;
  --beige:#f2d29e;
  --gold:#bd9151;
  --ink:#11110f;
  --shadow-dark:rgba(45,26,10,.38);
  --shadow-soft:rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#201710;font-family:"Noto Sans",Arial,sans-serif;}
body{display:flex;align-items:center;justify-content:center;}
.stage{
  position:relative;
  width:100vw;
  height:100vh;
  background:#1d140f;
}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;}
.overlay{position:absolute;inset:0;}
.dynamic{position:absolute; z-index:2; text-align:center; font-variant-numeric:tabular-nums;}
.shadow-light{text-shadow:0 2px 4px rgba(0,0,0,.18), 0 7px 14px rgba(0,0,0,.10);}
.shadow-dark{text-shadow:0 1px 2px rgba(255,255,255,.2), 0 3px 8px rgba(0,0,0,.10);}
.shadow-strong{text-shadow:0 3px 6px var(--shadow-dark),0 10px 18px rgba(0,0,0,.14);}

/* top clock */
#clock{left:0;right:0;top:16.05%;font-size:clamp(54px,8vw,92px);font-weight:800;line-height:1;color:#fffdf8;letter-spacing:1px;}

/* dates */
.greg-day-name, .hijri-day-name{
  color:#fffdf8;font-weight:800;letter-spacing:1.4px;
  writing-mode:vertical-rl; transform:rotate(180deg);
  font-size:clamp(16px,1.6vw,24px);
}
.greg-day-name{left:0.65%; top:33.05%; width:4.6%; height:10.4%; display:flex; align-items:center; justify-content:center;}
.hijri-day-name{left:49.85%; top:33.05%; width:4.6%; height:10.4%; display:flex; align-items:center; justify-content:center;}
#gregDay{left:6.7%; top:32.3%; width:13%; font-size:clamp(52px,6vw,86px); font-weight:800; color:#10100f; line-height:1;}
#gregMonth{left:19.1%; top:32.00%; width:22%; font-size:clamp(28px,3.15vw,46px); font-weight:700; text-align:left; color:#141412; font-family:"Cairo","Noto Sans",sans-serif;}
#gregYear{left:19.3%; top:37.70%; width:14%; font-size:clamp(22px,2.2vw,33px); font-weight:700; text-align:left; color:#252019; font-family:"Cairo","Noto Sans",sans-serif;}
#hijriDay{left:58.1%; top:32.3%; width:13%; font-size:clamp(52px,6vw,86px); font-weight:800; color:#10100f; line-height:1;}
#hijriMonth{left:69.9%; top:32.00%; width:22%; font-size:clamp(26px,2.95vw,45px); font-weight:700; text-align:left; color:#141412; font-family:"Cairo","Noto Sans",sans-serif;}
#hijriYear{left:70.1%; top:37.60%; width:14%; font-size:clamp(22px,2.2vw,33px); font-weight:700; text-align:left; color:#252019; font-family:"Cairo","Noto Sans",sans-serif;}

/* prayer times only, background already contains names/ar labels */
.prayer-time{
  color:#0d0c0b;
  font-weight:800;
  font-size:clamp(34px,4.15vw,66px);
  line-height:1;
  transform:translateX(-50%);
  white-space:nowrap;
}
#t0{left:8.73%; top:53.20%; width:13.4%;}
#t1{left:25.18%; top:53.20%; width:13.4%;}
#t2{left:41.57%; top:53.20%; width:13.4%;}
#t3{left:58.25%; top:53.20%; width:13.4%;}
#t4{left:74.67%; top:53.20%; width:13.4%;}
#t5{left:91.15%; top:53.20%; width:13.4%;}





/* countdown */
#nextPrayerName{
  left:18%; right:18%; top:79.75%;
  color:#fffdf8; font-weight:800; font-size:clamp(22px,2.15vw,36px); letter-spacing:.8px;
}
#countdown{
  left:0; right:0; top:84.0%;
  color:var(--beige); font-weight:800; font-size:clamp(60px,7.8vw,104px); line-height:1;
}

/* no-schedule fallback */
#statusMsg{left:0; right:0; bottom:2%; color:#fff; font-size:18px; display:none;}

/* 5 minute alert */
.prayer-alert-overlay{
  position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
  background:rgba(4,72,43,.78); backdrop-filter:blur(2px) saturate(.92); opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s ease;
}
.prayer-alert-overlay.show{opacity:1; visibility:visible;}
.prayer-alert-inner{
  width:min(92vw,1400px);
  padding:42px 48px 48px;
  text-align:center;
  border:2px solid rgba(242,210,158,.55);
  border-radius:28px;
  background:linear-gradient(rgba(10,92,56,.52),rgba(5,66,40,.52));
  box-shadow:0 24px 60px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.07);
  backdrop-filter: blur(6px);
}
.prayer-alert-kicker{font-size:clamp(22px,2.1vw,34px);font-weight:800;color:var(--beige);letter-spacing:2px;text-shadow:0 3px 8px rgba(0,0,0,.26);}
.prayer-alert-label{margin-top:10px;font-size:clamp(24px,2.6vw,40px);font-weight:700;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.26);}
.prayer-alert-text{margin-top:10px;font-size:clamp(50px,5.5vw,88px);font-weight:800;color:#fff;text-shadow:0 4px 10px rgba(0,0,0,.28);}
.prayer-alert-timer{margin-top:18px;font-size:clamp(92px,11vw,170px);font-weight:800;line-height:1;color:var(--beige);font-variant-numeric:tabular-nums;text-shadow:0 5px 12px rgba(0,0,0,.30);}
.prayer-alert-note{margin-top:12px;font-size:clamp(20px,2vw,30px);font-weight:600;color:#f7efe2;opacity:.95;text-shadow:0 3px 8px rgba(0,0,0,.26);}

@media (max-width: 900px){
  #clock{font-size:clamp(32px,10vw,60px); top:13.6%;}
  #gregDay,#hijriDay{font-size:clamp(28px,8vw,52px);}
  #gregMonth,#hijriMonth{font-size:clamp(16px,4.5vw,28px);}
  #gregYear,#hijriYear{font-size:clamp(14px,3.5vw,22px);}
  .greg-day-name,.hijri-day-name{font-size:clamp(11px,2.8vw,16px);}
  .prayer-time{font-size:clamp(20px,5.4vw,36px);}
  #nextPrayerName{top:76.2%; left:10%; right:10%; font-size:clamp(12px,3.3vw,19px);}
  #countdown{top:81.2%; font-size:clamp(34px,9.5vw,60px);}
}
</style>

function pad(n) { return String(n).padStart(2, "0"); }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function getScheduleForDate(d) { return schedule[dateKey(d)] || null; }

function getPrayersForDate(d) {
  const data = getScheduleForDate(d);
  if (!data) return [];
  return data.prayers.map(([name,time]) => [name,time]);
}

function getCurrentPrayers() {
  return getPrayersForDate(new Date());
}

function getEventsForDate(d) {
  const prayers = getPrayersForDate(d);
  if (!prayers.length) return [];

  const events = prayers.map(([name,time]) => ({ name, time }));

  // Every Friday Džuma is an extra congregational prayer at 13:30.
  // Podne stays visible and unchanged in its normal prayer box.
  if (d.getDay() === 5) {
    const podne = prayers.find(([name]) => name === 'Podne');
    if (podne) {
      const [ph, pm] = podne[1].split(":").map(Number);
      const [jh, jm] = JUMMAH_TIME.split(":").map(Number);
      const podneMinutes = ph * 60 + pm;
      const dzumaMinutes = jh * 60 + jm;

      // Only insert Džuma after Podne, as intended for the countdown flow.
      if (dzumaMinutes > podneMinutes) {
        events.push({ name:"Džuma", time:JUMMAH_TIME });
      }
    }
  }

  return events.sort((a,b) => {
    const [ah,am] = a.time.split(":").map(Number);
    const [bh,bm] = b.time.split(":").map(Number);
    return (ah*60+am) - (bh*60+bm);
  });
}

function getNextPrayer(now = new Date()) {
  const events = getEventsForDate(now);
  if (!events.length) return null;

  for (const event of events) {
    const [h,m] = event.time.split(":").map(Number);
    const d = new Date(now);
    d.setHours(h,m,0,0);
    if (d > now) {
      return { name:event.name, time:d, isTomorrow:false };
    }
  }

  const tomorrow = new Date(now);
  tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowEvents = getEventsForDate(tomorrow);
  if (!tomorrowEvents.length) return null;

  const event = tomorrowEvents[0];
  const [h,m] = event.time.split(":").map(Number);
  const d = new Date(tomorrow);
  d.setHours(h,m,0,0);

  return { name:event.name, time:d, isTomorrow:true };
}


function prayerDateTime(d, prayerName) {
  const data = getScheduleForDate(d);
  if (!data) return null;
  const prayer = data.prayers.find(([name]) => name === prayerName);
  if (!prayer) return null;

  const [h,m] = prayer[1].split(":").map(Number);
  const dt = new Date(d);
  dt.setHours(h,m,0,0);
  return dt;
}

function shouldUseDzumaBackground(now = new Date()) {
  const day = now.getDay();

  // Thursday: switch immediately after Thursday Jacija.
  if (day === 4) {
    const jacija = prayerDateTime(now, "Jacija");
    return !!jacija && now >= jacija;
  }

  // Friday: keep the Džuma background until Friday Jacija has passed.
  if (day === 5) {
    const jacija = prayerDateTime(now, "Jacija");
    return !!jacija && now < jacija;
  }

  return false;
}

function updateBackground(now = new Date()) {
  const img = document.getElementById("bgImage");
  if (!img) return;

  const desired = shouldUseDzumaBackground(now) ? DZUMA_BG : NORMAL_BG;
  const current = img.getAttribute("src");

  if (current !== desired) {
    img.setAttribute("src", desired);
  }
}

function updateClock(now = new Date()) {
  document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

function updateDates() {
  const now = new Date();
  const data = getScheduleForDate(now);
  document.getElementById('gregDayName').textContent = weekdayMap[now.getDay()];
  document.getElementById('gregDay').textContent = now.getDate() + '.';
  document.getElementById('gregMonth').textContent = monthMap[now.getMonth()];
  document.getElementById('gregYear').textContent = now.getFullYear();
  document.getElementById('hijriDayName').textContent = weekdayMap[now.getDay()];
  if (data) {
    document.getElementById('hijriDay').textContent = data.hijriDay;
    document.getElementById('hijriMonth').textContent = data.hijriMonth;
    document.getElementById('hijriYear').textContent = data.hijriYear;
  } else {
    document.getElementById('hijriDay').textContent = '--';
    document.getElementById('hijriMonth').textContent = '---';
    document.getElementById('hijriYear').textContent = '----';
  }
}

function updatePrayerTimes(now = new Date()) {
  const prayers = getPrayersForDate(now);
  const status = document.getElementById('statusMsg');
  if (!prayers.length) {
    status.style.display = 'block';
    status.textContent = 'Ingen vaktija inlagd för detta datum.';
    for (let i=0;i<6;i++) document.getElementById('t'+i).textContent = '--:--';
    return;
  }
  status.style.display = 'none';
  prayers.forEach((p,i)=>{
    const el = document.getElementById('t'+i);
    if (el) el.textContent = p[1];
  });
}

function getCountdownLabel(prayerName, isTomorrow) {
  const labelMap = {
    'Zora':'SABAH NAMAZA',
    'Podne':'PODNE NAMAZA',
    'Džuma':'DŽUMA NAMAZA',
    'Ikindija':'IKINDIJA NAMAZA',
    'Akšam':'AKŠAM NAMAZA',
    'Jacija':'JACIJA NAMAZA',
    'Izlaz sunca':'IZLASKA SUNCA'
  };
  const core = labelMap[prayerName] || prayerName.toUpperCase();
  return `VRIJEME DO ${isTomorrow ? 'SUTRA • ' : ''}${core}`;
}

function updateCountdown(now = new Date()) {
  const next = getNextPrayer(now);
  if (!next) {
    document.getElementById('countdown').textContent = '--:--:--';
    document.getElementById('nextPrayerName').textContent = 'VAKTIJA NIJE DOSTUPNA';
    return;
  }
  const diff = Math.max(0, next.time - now);
  const h = Math.floor(diff/1000/60/60);
  const m = Math.floor((diff/1000/60)%60);
  const s = Math.floor((diff/1000)%60);
  const prayerName = next.name;
  document.getElementById('countdown').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
  document.getElementById('nextPrayerName').textContent = getCountdownLabel(prayerName, next.isTomorrow);
}

function updatePrayerAlert(now = new Date()) {
  const overlay = document.getElementById('prayerAlertOverlay');
  const timerEl = document.getElementById('prayerAlertTimer');
  const textEl = document.getElementById('prayerAlertText');
  const next = getNextPrayer(now);
  if (!next) { overlay.classList.remove('show'); return; }
  const prayerName = next.name;
  if (prayerName === 'Izlaz sunca') { overlay.classList.remove('show'); return; }
  const totalSeconds = Math.max(0, Math.ceil((next.time - now) / 1000));
  if (totalSeconds <= 300) {
    overlay.classList.add('show');
    const mins = Math.floor(totalSeconds/60);
    const secs = totalSeconds % 60;
    timerEl.textContent = `${pad(mins)}:${pad(secs)}`;
    const map = {Zora:'SABAH NAMAZA',Podne:'PODNE NAMAZA',Džuma:'DŽUMA NAMAZA',Ikindija:'IKINDIJA NAMAZA',Akšam:'AKŠAM NAMAZA',Jacija:'JACIJA NAMAZA'};
    textEl.textContent = map[prayerName] || `${prayerName.toUpperCase()} NAMAZA`;
  } else {
    overlay.classList.remove('show');
  }
}

function refreshAll() {
  const now = new Date();
  updateBackground(now);
  updateClock(now);
  updateDates();
  updatePrayerTimes(now);
  updateCountdown(now);
  updatePrayerAlert(now);
}

let wakeLock = null;
async function requestWakeLock() {
  try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch(err){}
}
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') requestWakeLock(); });
function keepTvAlive() { document.body.setAttribute('data-keepalive', String(Date.now())); }
async function enterFullscreen() { try { const el=document.documentElement; if(!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen(); } catch(err){} }
function initLgTvMode() { requestWakeLock(); enterFullscreen(); keepTvAlive(); setInterval(keepTvAlive, 20000); setInterval(requestWakeLock, 60000); }

refreshAll();
initLgTvMode();

// Self-correcting clock loop. It aligns each refresh to the next real second
// instead of letting setInterval drift or fire bursts after a TV-browser stall.
let secondTickTimer = null;
function secondTick() {
  const now = new Date();
  updateBackground(now);
  updateClock(now);
  updateCountdown(now);
  updatePrayerAlert(now);
  const delay = Math.max(25, 1000 - (Date.now() % 1000) + 20);
  secondTickTimer = setTimeout(secondTick, delay);
}
secondTick();

setInterval(() => {
  const now = new Date();
  updateDates();
  updatePrayerTimes(now);
}, 60000);
let lastDateKey = dateKey(new Date());
setInterval(() => { const currentKey = dateKey(new Date()); if(currentKey !== lastDateKey) { lastDateKey = currentKey; location.reload(); } }, 60000);
</script>
